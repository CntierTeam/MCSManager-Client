name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mcsm-linux-amd64
            bin: mcsm
          - os: windows-latest
            artifact: mcsm-windows-amd64
            bin: mcsm.exe
          - os: macos-latest
            artifact: mcsm-macos-arm64
            bin: mcsm
          - os: macos-13
            artifact: mcsm-macos-amd64
            bin: mcsm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}

      - name: Build release binary
        run: cargo build --release -p mcsm --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          stage="${{ matrix.artifact }}"
          mkdir -p "$stage"
          cp "target/release/${{ matrix.bin }}" "$stage/mcsm"
          cp README.md LICENSE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/${{ matrix.bin }}" "$stage/mcsm.exe"
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Get-FileHash "$stage.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $stage.zip" } |
            Out-File -Encoding ascii "$stage.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List packages
        run: find dist -type f | sort

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish continuous pre-release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: false
          body: |
            自动构建自 `main`（每次推送更新）。

            Commit: `${{ github.sha }}`

            正式版本请使用 `v*` tag 触发的 Release。
          files: dist/*
          fail_on_unmatched_files: true

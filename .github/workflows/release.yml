name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mcsm-linux-amd64
            target: ""
            bin_path: target/release/mcsm
          - os: windows-latest
            artifact: mcsm-windows-amd64
            target: ""
            bin_path: target/release/mcsm.exe
          - os: macos-latest
            artifact: mcsm-macos-arm64
            target: ""
            bin_path: target/release/mcsm
          # macos-13 Intel runners are often unavailable; cross-compile from arm64 macOS.
          - os: macos-latest
            artifact: mcsm-macos-amd64
            target: x86_64-apple-darwin
            bin_path: target/x86_64-apple-darwin/release/mcsm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo build --release -p mcsm --locked --target "${{ matrix.target }}"
          else
            cargo build --release -p mcsm --locked
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="${{ matrix.artifact }}"
          mkdir -p "$stage"
          cp "${{ matrix.bin_path }}" "$stage/mcsm"
          cp README.md LICENSE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" | awk '{print tolower($1) "  '"${stage}.tar.gz"'"}' > "${stage}.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ matrix.bin_path }}" "$stage/mcsm.exe"
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Get-FileHash "$stage.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $stage.zip" } |
            Out-File -Encoding ascii "$stage.zip.sha256"

      - name: Upload Unix package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List packages
        run: find dist -type f | sort

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish continuous pre-release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: false
          body: |
            自动构建自 `main`（每次推送更新）。

            Commit: `${{ github.sha }}`

            正式版本请使用 `v*` tag 触发的 Release。
          files: dist/*
          fail_on_unmatched_files: true
